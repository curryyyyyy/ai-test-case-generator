[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-case-generator"
version = "0.1.0"
description = "基于 LangGraph + RAG 的 AI 测试用例生成工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "python-dotenv",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "chromadb",
    "pydantic",
    "openpyxl",
    "mistune",
    "python-docx",
    "sentence-transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*", "skills*", "utils*", "workflow*"]

[tool.setuptools.package-data]
skills = ["*.md"]
rag = ["*.md"]
